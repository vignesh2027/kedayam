<!doctype html><html><head><meta charset=utf-8><style>
body{margin:0;zoom:2.625;font-family:-apple-system,'Helvetica Neue','Tamil Sangam MN','Kohinoor Devanagari',sans-serif;}
.phone{width:412px;min-height:620px;}
.bar{display:flex;justify-content:space-between;padding:8px 18px;font-size:13px;font-weight:600}
.head{padding:10px 16px;font-size:17px;font-weight:600;border-bottom:1px solid}
.msgs{padding:18px 12px}
.time{text-align:center;font-size:12px;margin:6px 0 12px}
.b{max-width:300px;padding:10px 14px;border-radius:18px;font-size:16px;line-height:1.4;white-space:pre-wrap}
.sms{background:#fff;color:#000}.sms .head{border-color:#ddd;text-align:center}.sms .time{color:#888}.sms .b{background:#e9e9eb;}
.chat_dark{background:#0b141a;color:#e9edef}.chat_dark .head{background:#1f2c34;border-color:#1f2c34}.chat_dark .time{color:#8696a0}.chat_dark .b{background:#1f2c34;color:#e9edef;border-radius:8px}
.upi{background:#f2f4f8;color:#111}.upi .card{margin:24px 16px;background:#fff;border-radius:16px;padding:22px;box-shadow:0 1px 4px #0002}
.upi .t{font-size:20px;font-weight:700}.upi .from{color:#444;margin:6px 0 18px}.upi .amt{font-size:40px;font-weight:700;margin:6px 0}
.upi .note{background:#f5f5f5;border-radius:8px;padding:10px;margin:14px 0}.upi .btns{display:flex;gap:12px}.upi .btns div{flex:1;text-align:center;padding:12px;border-radius:10px;font-weight:700}
.upi .no{border:2px solid #555}.upi .yes{background:#1a7f37;color:#fff}
</style></head><body class='upi'><div class='phone'><div class="bar"><span>10:42</span><span>4G 72%</span></div><div class="card"><div class="t">Payment request</div>
<div class="from">From rewards.sbi@ybl</div><div class="amt">Rs 4,999</div><div class="note">Note: Cashback reward. Enter PIN to receive.</div>
<div class="btns"><div class="no">Decline</div><div class="yes">Pay</div></div></div></div></body></html>
