<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kedayam{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/logo-512.png">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <div class="wrap top-inner">
      <a class="brand" href="/?lang={{ lang }}" aria-label="Kedayam, {{ t('home') }}">
        <img src="/static/logo.svg" alt="" width="48" height="48">
        <span class="brand-name">Kedayam</span>
        <span class="brand-native" lang="ta">கேடயம்</span>
        <span class="brand-native" lang="hi">केडयम</span>
      </a>
      <nav class="langs" aria-label="{{ t('language') }}">
        {% for code in langs %}
          <a href="{{ request.url.path if request.url.path not in ('/check', '/check-image', '/family/remove') else '/' }}?lang={{ code }}" lang="{{ code }}" hreflang="{{ code }}"
             {% if code == lang %}aria-current="true" class="on"{% endif %}>{{ lang_names[code] }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>
  <main id="main" class="wrap">
    {% block main %}{% endblock %}
  </main>
  <footer class="foot">
    <div class="wrap">
      <p class="helpline"><strong>{{ t('helpline') }}</strong> · cybercrime.gov.in</p>
      <p>{{ t('limit_note') }}</p>
      <p><a href="/about?lang={{ lang }}">{{ t('about') }}</a> · <a href="/family?lang={{ lang }}">{{ t('family_title') }}</a></p>
    </div>
  </footer>
</body>
</html>
