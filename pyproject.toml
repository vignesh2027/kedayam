[project]
name = "kavach"
version = "0.1.0"
description = "A local UPI and SMS scam checker for older parents in India"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.5",
    "pillow>=10.4",
]

[project.scripts]
kavach = "kavach.app:main"
kavach-train = "kavach.classifier:main"
kavach-eval = "kavach.evaluate:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kavach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
