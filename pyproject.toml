[project]
name = "kedayam"
version = "0.1.0"
description = "A local UPI and SMS scam checker for older parents in India"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.5",
    "pillow>=10.4",
]

[project.scripts]
kedayam = "kedayam.app:main"
kedayam-train = "kedayam.classifier:main"
kedayam-eval = "kedayam.evaluate:main"
kedayam-ocr-setup = "kedayam.ocr:setup_main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kedayam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
